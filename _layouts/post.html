---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="muted">
    {{ page.date | date: '%b %-d, %Y' | downcase }}
    {% for tag in page.tags %}
      <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
    {% endfor %}
  </p>

  {{ content }}
</article>

<hr style="border: 0; border-top: 1px solid var(--line); margin: 48px 0 16px;">
<p class="muted" style="display: flex; justify-content: space-between; gap: 16px;">
  <span>{% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% endif %}</span>
  <span>{% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}</span>
</p>
